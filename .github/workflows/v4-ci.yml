name: V4 CI

on:
  push:
    branches: [v4-dev]
    paths:
      - 'v4/**'
      - '.github/workflows/v4-ci.yml'
  pull_request:
    paths:
      - 'v4/**'
      - '.github/workflows/v4-ci.yml'

jobs:
  test-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check v4/engine.js
          node --check v4/coach-layer.js
      - name: Training engine tests
        run: node v4/tests/engine.test.cjs
      - name: Coach experience tests
        run: node v4/tests/coach-layer.test.cjs