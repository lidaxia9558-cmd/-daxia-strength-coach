<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="100岁力量教练"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>大虾 · 100岁力量教练</title><style>
:root{--b:#f7f6f2;--c:#fff;--t:#171917;--m:#73776f;--l:#e3e5df;--g:#2f6b50;--gs:#e1eee7;--s:#f0f2ee}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}.app{max-width:760px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px calc(38px + env(safe-area-inset-bottom))}.head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:14px}h1{font-size:25px;margin:3px 0 6px}.muted,.mini{color:var(--m)}.muted{font-size:13px;line-height:1.5}.mini{font-size:12px}.pill{background:var(--gs);color:var(--g);border-radius:999px;padding:8px 10px;font-size:12px;font-weight:700;white-space:nowrap}.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:16px;margin-bottom:12px}.stage{display:grid;grid-template-columns:1fr auto;gap:12px}.phase{font-size:12px;color:var(--m)}.name{font-size:28px;font-weight:800;margin-top:5px}.num{font-size:48px;font-weight:820;font-variant-numeric:tabular-nums;text-align:right}.barbg{height:8px;border-radius:99px;background:#eceee9;overflow:hidden;margin:15px 0}.bar{height:100%;width:100%;background:var(--g);transition:width .2s}.cue{background:var(--s);border-radius:14px;padding:13px;font-size:14px;line-height:1.55}.bad{margin-top:8px;background:#faf4f0}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{border:1px solid var(--l);border-radius:99px;padding:5px 8px;font-size:12px;color:var(--m)}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:14px}.btn{min-height:52px;border:0;border-radius:14px;font-weight:750}.primary{background:var(--g);color:white}.secondary{background:#eef0ec}.ghost{background:white;border:1px solid var(--l);color:var(--m)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.history{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:11px}.day{text-align:center}.dot{height:30px;border-radius:10px;background:var(--s);border:1px solid var(--l);display:grid;place-items:center;font-size:12px}.dot.ok{background:var(--gs);color:var(--g);border-color:#c8dfd1}.settings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.field label{display:block;font-size:11px;color:var(--m);margin-bottom:4px}.field input{width:100%;min-height:44px;border:1px solid var(--l);border-radius:12px;padding:8px 10px;font-size:16px}.voice{width:22px;height:22px;accent-color:var(--g)}.finish{display:none;text-align:center;background:var(--gs)}.finish.show{display:block}.rates{display:flex;gap:8px;justify-content:center;margin-top:12px}.rate{min-height:44px;padding:8px 12px;border:1px solid #bdd8c7;background:white;border-radius:12px}.tip{margin-top:10px;font-size:13px;line-height:1.55}.install{font-size:12px;line-height:1.5;color:var(--m)}
@media(max-width:480px){.app.focus .optional{display:none}.name{font-size:25px}.num{font-size:44px}.controls{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:3;background:rgba(247,246,242,.94);padding:8px 0}.settings{grid-template-columns:1fr 1fr}.btn{min-height:54px}}
</style></head><body><main class="app" id="app"><div class="head"><div><div class="mini">每日居家 · 约15–18分钟</div><h1>100岁力量教练</h1><div class="muted">6个核心动作 × 2轮。保持标准、逐渐变强，不追求练到力竭。</div></div><div class="pill" id="roundPill">第1轮 / 2轮</div></div>
<section class="card" id="trainer"><div class="stage"><div><div class="phase" id="phase">准备</div><div class="name" id="name">2分钟热身</div></div><div><div class="mini" style="text-align:right">剩余</div><div class="num" id="timer">120</div></div></div><div class="barbg"><div class="bar" id="bar"></div></div><div class="cue"><b class="mini">教练提示</b><div id="cue">原地走动、轻柔深蹲、髋屈伸和肩绕环，让身体热起来。</div></div><div class="cue bad"><b class="mini">避免</b><div id="mistake">热身不需要做到疲劳。</div></div><div class="meta"><span class="tag" id="gear">无需器械</span><span class="tag"><span id="done">0</span>/12组</span><span class="tag">保留2–3次余力</span></div><div class="controls"><button class="btn primary" id="start">开始训练</button><button class="btn secondary" id="next">本组完成</button><button class="btn ghost" id="reset">重置</button></div></section>
<section class="card optional"><div class="row"><div><b>语音教练</b><div class="mini">自动报动作与倒计时</div></div><input class="voice" id="voice" type="checkbox" checked></div><div class="settings"><div class="field"><label>深蹲负重 kg</label><input id="sq" type="number" min="0" step="0.5"></div><div class="field"><label>RDL负重 kg</label><input id="rdl" type="number" min="0" step="0.5"></div><div class="field"><label>划船负重 kg</label><input id="row" type="number" min="0" step="0.5"></div><div class="field"><label>农夫行走 kg/手</label><input id="carry" type="number" min="0" step="0.5"></div></div></section>
<section class="card optional"><div class="row"><b>最近7天</b><span class="mini">完成训练 ✓</span></div><div class="history" id="history"></div></section>
<section class="card finish" id="finish"><h2 style="margin:0 0 6px">今天的力量已经存入 ✓</h2><div class="muted">感觉今天整体难度如何？</div><div class="rates"><button class="rate" data-r="easy">偏轻松</button><button class="rate" data-r="good">刚刚好</button><button class="rate" data-r="hard">偏吃力</button></div><div class="tip" id="tip"></div></section>
<section class="card optional install">iPhone/iPad：在 Safari 点“分享” → “添加到主屏幕”，以后就能像 App 一样直接打开。若出现尖锐疼痛、胸痛、明显头晕或异常气短，请停止训练。</section></main>
<script>
(()=>{const E=[['深蹲','双脚约与肩同宽，臀部向后下坐，膝盖跟随脚尖，稳定站起。','避免膝盖明显内扣或塌腰。','背包 / 哑铃 / 徒手'],['罗马尼亚硬拉 RDL','膝微屈，臀部向后推，背部中立，感受臀腿后侧拉长后用髋站起。','避免弯腰去够地面。','背包 / 哑铃'],['俯卧撑','头背臀尽量一条直线，肘约45°，胸口主动靠近地面或桌沿。','避免塌腰、耸肩。','徒手 / 桌沿辅助'],['划船','稳住肩胛，把肘部向后拉，顶端短暂停顿。','避免耸肩和身体甩动。','弹力带 / 哑铃'],['下拉 / 引体','胸口微抬，把肘部向身体两侧下拉，注意背部收紧。','避免只用手臂硬拽。','弹力带 / 单杠'],['农夫行走','站直，核心收紧，肩膀自然下沉，稳定缓慢行走。','避免身体左右歪斜。','哑铃 / 水壶 / 重物']],D={warm:120,work:45,rest:20},$=x=>document.getElementById(x),SKEY='daxiaCoachOnlineV1';let s=load(),mode='warm',idx=0,round=1,sec=D.warm,done=0,running=false,deadline=0,tick=null,hiddenAt=0,hiddenRemain=0;
function load(){try{return JSON.parse(localStorage.getItem(SKEY))||{voice:true,loads:{},sessions:[],active:null}}catch(e){return{voice:true,loads:{},sessions:[],active:null}}}function save(){localStorage.setItem(SKEY,JSON.stringify(s))}function day(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function speak(t){if(!s.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=1.03;speechSynthesis.speak(u)}catch(e){}}function total(){return D[mode]||1}function cur(){return E[idx]}
function render(){let ex=cur();$('timer').textContent=sec;$('bar').style.width=Math.max(0,sec/total()*100)+'%';$('done').textContent=done;$('roundPill').textContent='第'+Math.min(round,2)+'轮 / 2轮';$('app').classList.toggle('focus',running);if(mode==='warm'){$('phase').textContent='热身';$('name').textContent='2分钟热身';$('cue').textContent='原地走动、轻柔深蹲、髋屈伸和肩绕环，让身体热起来。';$('mistake').textContent='热身不需要做到疲劳。';$('gear').textContent='无需器械'}else if(mode==='work'){$('phase').textContent='第'+round+'轮 · 训练';$('name').textContent=ex[0];$('cue').textContent=ex[1];$('mistake').textContent=ex[2];$('gear').textContent=ex[3]}else if(mode==='rest'){$('phase').textContent='转换 / 休息';$('name').textContent='休息20秒';$('cue').textContent='放松呼吸，调整器械和站位，准备下一个动作。';$('mistake').textContent='不要急着抢下一组。';$('gear').textContent='准备下一动作'}$('start').textContent=running?'暂停':(done||mode!=='warm'?'继续':'开始训练');persist()}
function persist(){if(mode==='done'){s.active=null}else{s.active={date:day(),mode,idx,round,sec,done,updated:Date.now()}}save()}
function announce(){if(mode==='warm')speak('开始两分钟热身。轻松活动身体。');else if(mode==='work')speak(cur()[0]+'，开始。'+cur()[1]);else if(mode==='rest')speak('休息二十秒。')}
function advance(voice=true){if(mode==='warm'){mode='work';sec=D.work;idx=0;round=1;if(voice)speak('热身完成。深蹲，开始。');return}if(mode==='work'){done=Math.min(12,done+1);mode='rest';sec=D.rest;if(voice)speak('这一组完成，休息二十秒。');return}idx++;if(idx>=6){idx=0;round++}if(round>2){finish();return}mode='work';sec=D.work;if(voice)speak(cur()[0]+'，开始。')}
function sync(){if(!running)return;let n=Date.now(),guard=0;while(n>=deadline&&guard++<30){advance(false);if(mode==='done')return;deadline+=total()*1000}sec=Math.max(0,Math.ceil((deadline-n)/1000));if(sec===10&&mode==='work')speak('还有十秒');render()}
function start(){if(mode==='done')return;running=true;deadline=Date.now()+Math.max(1,sec)*1000;$('start').textContent='暂停';announce();tick=setInterval(sync,250);render()}
function pause(){running=false;if(tick)clearInterval(tick);tick=null;if(deadline)sec=Math.max(1,Math.ceil((deadline-Date.now())/1000));deadline=0;render()}
function next(){if(mode==='done')return;if(mode==='work')done=Math.min(12,done+1);if(mode==='warm'){mode='work';idx=0;round=1;sec=D.work}else{idx++;if(idx>=6){idx=0;round++}if(round>2){finish();return}mode='work';sec=D.work}if(running)deadline=Date.now()+sec*1000;render();if(running)announce()}
function finish(){running=false;if(tick)clearInterval(tick);tick=null;mode='done';sec=0;done=12;s.active=null;if(!s.sessions.some(x=>x.date===day()))s.sessions.push({date:day(),rating:null});s.sessions=s.sessions.slice(-200);save();$('finish').classList.add('show');$('start').disabled=true;$('app').classList.remove('focus');hist();speak('训练完成。今天的力量已经存入。')}
function reset(){pause();mode='warm';idx=0;round=1;sec=D.warm;done=0;s.active=null;save();$('finish').classList.remove('show');$('start').disabled=false;render()}
function hist(){let box=$('history');box.innerHTML='';for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),ok=s.sessions.some(x=>x.date===k),el=document.createElement('div');el.className='day';el.innerHTML='<div class="dot '+(ok?'ok':'')+'">'+(ok?'✓':d.getDate())+'</div><div class="mini">'+['日','一','二','三','四','五','六'][d.getDay()]+'</div>';box.appendChild(el)}}
function restore(){s.voice=s.voice!==false;$('voice').checked=s.voice;['sq','rdl','row','carry'].forEach(k=>$(k).value=s.loads[k]??'');let a=s.active;if(a&&a.date===day()&&Date.now()-a.updated<10800000){mode=a.mode;idx=a.idx||0;round=a.round||1;sec=a.sec||D[mode];done=a.done||0}else{s.active=null;save()}}
$('start').onclick=()=>running?pause():start();$('next').onclick=next;$('reset').onclick=reset;$('voice').onchange=e=>{s.voice=e.target.checked;save()};['sq','rdl','row','carry'].forEach(k=>$(k).onchange=e=>{s.loads[k]=Math.max(0,Number(e.target.value)||0);save()});document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>{let r=b.dataset.r,x=[...s.sessions].reverse().find(x=>x.date===day());if(x)x.rating=r;save();$('tip').textContent=r==='easy'?'下次建议：动作仍标准的前提下，主动作增加一点负重或难度。':r==='hard'?'下次建议：先维持或略降难度，确保动作标准和恢复。':'下次建议：保持当前难度，连续稳定完成后再小幅进阶。'});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){hiddenAt=Date.now();hiddenRemain=Math.max(1,Math.ceil((deadline-Date.now())/1000))}else if(!document.hidden&&running&&hiddenAt){let away=Date.now()-hiddenAt;if(away>90000){running=false;if(tick)clearInterval(tick);tick=null;sec=hiddenRemain;deadline=0;speak('训练已暂停。点击继续即可接着练。');render()}else sync();hiddenAt=0}});restore();hist();render()})();
</script></body></html>
