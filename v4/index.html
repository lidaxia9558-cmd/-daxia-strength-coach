<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="100岁力量教练 V4">
<title>100岁力量教练 V4 Preview</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#171917;--muted:#747872;--line:#e5e7e1;--g:#2f6b50;--gs:#e2efe8;--soft:#f1f3ef;--warm:#f7efe3;--red:#8d443c}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Display",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{touch-action:manipulation}.app{max-width:780px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px calc(42px + env(safe-area-inset-bottom))}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.k{font-size:12px;color:var(--muted)}h1{font-size:26px;margin:4px 0 6px}.lead{font-size:13px;color:var(--muted);line-height:1.55}.pill{background:var(--gs);color:var(--g);padding:8px 10px;border-radius:999px;font-size:12px;font-weight:750;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{font-size:13px;color:var(--muted);line-height:1.55}.mini{font-size:12px;color:var(--muted)}
.plan{display:grid;gap:8px;margin-top:12px}.item{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 11px;background:#fff}.item.active{border-color:#b9d5c4;background:var(--gs)}.item.done{opacity:.48}.num{width:28px;height:28px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:750}.item b{font-size:14px}.goal{font-size:12px;color:var(--g);font-weight:750;text-align:right}.eta{margin-top:10px;padding:10px 12px;border-radius:13px;background:var(--soft);font-size:13px}
.stage{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}.phase{font-size:12px;color:var(--muted)}.name{font-size:30px;font-weight:820;margin-top:5px;line-height:1.1}.right{text-align:right}.big{font-size:48px;font-weight:840;line-height:1;font-variant-numeric:tabular-nums}.goalbox{margin:15px 0;background:var(--soft);border-radius:16px;padding:14px}.goalmain{font-size:24px;font-weight:820}.cue{margin-top:9px;font-size:13px;line-height:1.55}.barbg{height:8px;border-radius:99px;background:#eceee9;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--g);width:0;transition:width .2s}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{font-size:12px;color:var(--muted);padding:5px 8px;border:1px solid var(--line);border-radius:99px}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:9px;margin-top:14px}.btn{border:0;border-radius:14px;min-height:54px;font-weight:760}.primary{background:var(--g);color:white}.secondary{background:#eef0ec;color:var(--text)}.ghost{background:white;border:1px solid var(--line);color:var(--muted)}.triple{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.rest{display:none}.rest.show{display:block}.restbox{text-align:center;padding:10px}.restnum{font-size:62px;font-weight:850}.finish{display:none;text-align:center;background:var(--gs)}.finish.show{display:block}.rates{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}.rate{min-height:46px;padding:9px 13px;border:1px solid #bed8c8;background:#fff;border-radius:12px}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:12px}summary{font-weight:750;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:16px}
.note{background:var(--warm);border-radius:14px;padding:11px 12px;font-size:12px;line-height:1.55;color:#635b4c;margin-top:10px}
@media(max-width:520px){.name{font-size:26px}.big{font-size:44px}.app.training .optional{display:none}.app.training .actions{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:4;background:rgba(247,246,242,.94);padding:8px 0}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="head">
    <div>
      <div class="k">V4.0 开发预览 · 每次 ≤30分钟</div>
      <h1>100岁力量教练</h1>
      <div class="lead">今天练什么、做几次、休息多久，都替你安排好。</div>
    </div>
    <div class="pill" id="dayType">正常日</div>
  </header>
  <section class="card optional">
    <div class="row"><div><b>今天的训练</b><div class="muted" id="dateText"></div></div><div class="mini" id="progress">0 / 8组</div></div>
    <div class="plan" id="plan"></div><div class="eta" id="eta">预计约18分钟</div>
  </section>
  <section class="card" id="coach">
    <div class="stage"><div><div class="phase" id="phase">准备</div><div class="name" id="name">2分钟热身</div></div><div class="right"><div class="mini" id="rightLabel">剩余</div><div class="big" id="rightValue">120</div></div></div>
    <div class="barbg"><div class="bar" id="bar"></div></div>
    <div class="goalbox"><div class="mini">今天的目标</div><div class="goalmain" id="goalMain">轻松活动身体</div><div class="cue" id="cue">原地走、肩绕环、徒手深蹲和髋铰链练习。热身不需要做到累。</div></div>
    <div class="tags"><span class="tag" id="setTag">热身</span><span class="tag" id="loadTag">无需负重</span><span class="tag">保留2–3次余力</span></div>
    <div class="actions" id="actions"><button class="btn primary" id="start">开始训练</button><button class="btn ghost" id="reset">重置</button></div>
    <div class="triple" id="setButtons" style="display:none"><button class="btn primary" id="hit">完成目标</button><button class="btn secondary" id="miss">没做到目标</button><button class="btn ghost" id="skip">跳过</button></div>
  </section>
  <section class="card rest" id="rest"><div class="restbox"><div class="mini">组间休息 · 下一组</div><div class="restnum" id="restNum">60</div><div class="muted" id="nextText">保持呼吸，下一组继续。</div><button class="btn secondary" id="endRest" style="margin-top:12px;min-width:180px">提前开始</button></div></section>
  <section class="card optional"><div class="row"><div><b>语音教练</b><div class="mini">动作开始、休息结束时提醒</div></div><input id="voice" type="checkbox" checked style="width:22px;height:22px;accent-color:var(--g)"></div><details><summary>我的训练重量</summary><div class="grid"><div class="field"><label>深蹲总负重 kg</label><input id="sq" type="number" min="0" step=".5"></div><div class="field"><label>RDL总负重 kg</label><input id="rdl" type="number" min="0" step=".5"></div><div class="field"><label>划船单手 kg</label><input id="rowLoad" type="number" min="0" step=".5"></div><div class="field"><label>农夫行走 kg/手</label><input id="carry" type="number" min="0" step=".5"></div></div><div class="note">初次使用可以全部留空或填0。先把动作做标准，再逐步增加负重。</div></details></section>
  <section class="card finish" id="finish"><h2 style="margin:0 0 6px">今天的力量已经存入 ✓</h2><div class="muted">今天整体感觉如何？系统会据此安排下一次。</div><div class="rates"><button class="rate" data-rate="easy">偏轻松</button><button class="rate" data-rate="good">刚刚好</button><button class="rate" data-rate="hard">偏吃力</button></div><div class="note" id="nextAdvice" style="display:none"></div></section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),KEY='daxiaCoachV4Preview';const EX={squat:{name:'深蹲',type:'reps',min:8,max:12,load:'sq',unit:'kg总负重',rest:70,cue:'臀部向后下坐，膝盖跟随脚尖，脚掌稳稳踩地。'},rdl:{name:'罗马尼亚硬拉 RDL',type:'reps',min:8,max:12,load:'rdl',unit:'kg总负重',rest:80,cue:'膝微屈，臀部向后推，背部中立，感受臀腿后侧拉长。'},push:{name:'俯卧撑',type:'reps',min:8,max:15,load:null,unit:'自重',rest:60,cue:'头背臀保持一条直线，肘部约45°，不要塌腰。'},row:{name:'划船',type:'reps',min:8,max:12,load:'rowLoad',unit:'kg/手',rest:60,cue:'稳住肩胛，把肘部向后拉，顶端短暂停顿。'},pull:{name:'下拉 / 引体',type:'reps',min:6,max:12,load:null,unit:'自重/弹力带',rest:70,cue:'胸口微抬，把肘部向身体两侧下拉，感受背部收紧。'},carry:{name:'农夫行走',type:'time',seconds:40,load:'carry',unit:'kg/手',rest:55,cue:'站直、核心收紧、肩膀自然下沉，稳定缓慢地走。'}};const WEEK=[{type:'正常日 A',ids:['squat','push','row','carry'],sets:2},{type:'正常日 B',ids:['rdl','pull','push','carry'],sets:2},{type:'轻量日',ids:['squat','rdl','row','pull'],sets:1},{type:'正常日 A',ids:['squat','push','row','carry'],sets:2},{type:'正常日 B',ids:['rdl','pull','push','carry'],sets:2},{type:'恢复日',ids:['squat','push','row','carry'],sets:1,light:true},{type:'轻量日',ids:['rdl','pull','push','carry'],sets:1}];let st=load();function load(){try{return JSON.parse(localStorage.getItem(KEY))||{voice:true,loads:{sq:0,rdl:0,rowLoad:0,carry:0},targets:{},history:[]}}catch(e){return{voice:true,loads:{sq:0,rdl:0,rowLoad:0,carry:0},targets:{},history:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(st))}function kd(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function fd(){let d=new Date();return `${d.getMonth()+1}月${d.getDate()}日 · 星期${'日一二三四五六'[d.getDay()]}`}function pd(){return WEEK[(new Date().getDay()+6)%7]}function target(id){let e=EX[id],v=st.targets[id];if(!v){v={reps:e.type==='reps'?e.min:null};st.targets[id]=v}return v}function bp(){let p=pd(),arr=[];p.ids.forEach(id=>{for(let s=1;s<=p.sets;s++)arr.push({id,set:s,total:p.sets,hit:null})});return{type:p.type,light:!!p.light,sets:p.sets,arr}}let plan=bp(),pos=-1,mode='ready',warm=120,restSec=0,timer=null,deadline=0;function speak(t){if(!st.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=1.02;speechSynthesis.speak(u)}catch(e){}}function loadText(id){let e=EX[id];if(!e.load)return e.unit;let v=Number(st.loads[e.load]||0);return v>0?`${v} ${e.unit}`:'暂不负重'}function goalText(id){let e=EX[id],t=target(id);if(e.type==='time')return `${e.seconds}秒`;let reps=t.reps||e.min;if(plan.light)reps=Math.max(e.min,Math.round(reps*.8));return `${reps}次`}function est(){let s=120;for(let x of plan.arr){let e=EX[x.id];s+=e.type==='time'?e.seconds:35;s+=e.rest}return Math.min(30,Math.max(10,Math.round(s/60)))}function renderPlan(){let b=$('plan');b.innerHTML='';plan.arr.forEach((x,i)=>{let e=EX[x.id],d=document.createElement('div');d.className='item'+(i===pos?' active':'')+(x.hit!==null?' done':'');d.innerHTML=`<div class="num">${i+1}</div><div><b>${e.name}</b><div class="mini">第${x.set}/${x.total}组 · ${loadText(x.id)}</div></div><div class="goal">${goalText(x.id)}</div>`;b.appendChild(d)});$('progress').textContent=`${plan.arr.filter(x=>x.hit!==null).length} / ${plan.arr.length}组`;$('eta').textContent=`预计约${est()}分钟 · 上限30分钟`;$('dayType').textContent=plan.type}function render(){renderPlan();$('dateText').textContent=fd();$('voice').checked=st.voice;if(mode==='ready'){$('phase').textContent='准备';$('name').textContent='2分钟热身';$('rightLabel').textContent='剩余';$('rightValue').textContent=warm;$('goalMain').textContent='轻松活动身体';$('cue').textContent='原地走、肩绕环、徒手深蹲和髋铰链练习。热身不需要做到累。';$('setTag').textContent='热身';$('loadTag').textContent='无需负重';$('bar').style.width=(1-warm/120)*100+'%';$('setButtons').style.display='none';$('actions').style.display='grid';$('app').classList.remove('training')}else if(mode==='work'){let x=plan.arr[pos],e=EX[x.id];$('phase').textContent=`${plan.type} · 第${pos+1}/${plan.arr.length}组`;$('name').textContent=e.name;$('rightLabel').textContent=e.type==='time'?'目标':'次数';$('rightValue').textContent=e.type==='time'?e.seconds:goalText(x.id).replace('次','');$('goalMain').textContent=`${loadText(x.id)} × ${goalText(x.id)}`;$('cue').textContent=e.cue;$('setTag').textContent=`第${x.set}/${x.total}组`;$('loadTag').textContent=loadText(x.id);$('bar').style.width=(pos/plan.arr.length*100)+'%';$('setButtons').style.display='grid';$('actions').style.display='none';$('app').classList.add('training')}}function startWarm(){mode='ready';$('start').textContent='暂停';deadline=Date.now()+warm*1000;timer=setInterval(()=>{warm=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('rightValue').textContent=warm;$('bar').style.width=(1-warm/120)*100+'%';if(warm<=0){clearInterval(timer);timer=null;pos=0;mode='work';speak('热身完成。'+EX[plan.arr[0].id].name+'，'+goalText(plan.arr[0].id));render()}},250);speak('开始两分钟热身。')}function pauseWarm(){if(timer){clearInterval(timer);timer=null;warm=Math.max(1,Math.ceil((deadline-Date.now())/1000));$('start').textContent='继续'}}function complete(hit){if(mode!=='work')return;plan.arr[pos].hit=hit;let e=EX[plan.arr[pos].id];restSec=e.rest;if(pos>=plan.arr.length-1){finish();return}mode='rest';$('coach').style.display='none';$('rest').classList.add('show');$('restNum').textContent=restSec;$('nextText').textContent=`下一组：${EX[plan.arr[pos+1].id].name} · ${goalText(plan.arr[pos+1].id)}`;deadline=Date.now()+restSec*1000;timer=setInterval(()=>{restSec=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('restNum').textContent=restSec;if(restSec<=0)endRest()},250);renderPlan()}function endRest(){if(timer){clearInterval(timer);timer=null}pos++;mode='work';$('rest').classList.remove('show');$('coach').style.display='block';speak(EX[plan.arr[pos].id].name+'，'+goalText(plan.arr[pos].id));render()}function finish(){if(timer){clearInterval(timer);timer=null}mode='done';let missed=plan.arr.some(x=>x.hit===false);st.history.push({date:kd(),type:plan.type,missed,rating:null});st.history=st.history.slice(-120);save();$('coach').style.display='none';$('rest').classList.remove('show');$('finish').classList.add('show');speak('训练完成。今天的力量已经存入。');renderPlan()}function progress(rate){let ids=[...new Set(plan.arr.map(x=>x.id))],missed=plan.arr.some(x=>x.hit===false),ad=[];ids.forEach(id=>{let e=EX[id],t=target(id);if(e.type==='reps'){if(missed||rate==='hard'){t.reps=Math.max(e.min,(t.reps||e.min)-1);ad.push(`${e.name}：下次保持或略降难度`)}else if(rate==='easy'){if(t.reps<e.max){t.reps++;ad.push(`${e.name}：下次目标 +1次`)}else if(e.load&&Number(st.loads[e.load]||0)>0){st.loads[e.load]=Math.round((Number(st.loads[e.load])+1)*2)/2;t.reps=e.min;ad.push(`${e.name}：下次小幅加重`)}else ad.push(`${e.name}：下一步升级动作难度`)}else{if(t.reps<e.max)t.reps++;ad.push(`${e.name}：下次尝试多1次`)}}else if(rate==='easy'&&e.load&&Number(st.loads[e.load]||0)>0){st.loads[e.load]=Math.round((Number(st.loads[e.load])+0.5)*2)/2;ad.push(`${e.name}：下次每手小幅加重`)}});let h=st.history[st.history.length-1];if(h)h.rating=rate;save();$('nextAdvice').style.display='block';$('nextAdvice').textContent='下次建议：'+ad.slice(0,3).join('；')+'。';sync()}function reset(){if(timer)clearInterval(timer);timer=null;plan=bp();pos=-1;mode='ready';warm=120;$('coach').style.display='block';$('rest').classList.remove('show');$('finish').classList.remove('show');$('start').textContent='开始训练';render()}function sync(){['sq','rdl','rowLoad','carry'].forEach(id=>{$(id).value=st.loads[id]||''})}$('start').onclick=()=>timer?pauseWarm():startWarm();$('reset').onclick=reset;$('hit').onclick=()=>complete(true);$('miss').onclick=()=>complete(false);$('skip').onclick=()=>complete(false);$('endRest').onclick=endRest;$('voice').onchange=e=>{st.voice=e.target.checked;save()};['sq','rdl','rowLoad','carry'].forEach(id=>{$(id).onchange=e=>{st.loads[id]=Math.max(0,Number(e.target.value||0));save();renderPlan()}});document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>progress(b.dataset.rate));sync();render()})();
</script>
</body>
</html>
